[project]
name = "conv"
version = "0.1.0"
description = "Convert files between formats locally. Files never leave your machine."
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    # Depends on PyMuPDF (AGPL-3.0), hence this project's license (D-017).
    "pdf2docx>=0.5.13",
    # 11+ for Image.has_transparency_data and current WEBP handling.
    "pillow>=11",
    # Bundled resvg renderer: no system cairo needed, and it never loads remote URLs (G-001).
    "resvg-py>=0.5",
]

[project.scripts]
conv = "conv.cli:run"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
